[project]
name = "visual-production-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Pillow>=13,<14",
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.1",
    "fastapi>=0.162,<0.163",
    "google-genai==3.3.0",
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14,<2.15",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.41,<1",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
